<SCRIPT TYPE="text/javascript" LANGUAGE="javascript">
function checkEnabled()
{
  disabledButton = document.getElementById('enableCertmon').disabled;
  disabledValue = !document.getElementById('enableCertmon').checked | disabledButton;
  document.getElementById('immediateFetch').disabled = disabledValue;
  document.getElementById('timeSelect').disabled = disabledValue;
  document.getElementById('repeatUnit').disabled = disabledValue;
  document.getElementById('submit_button').disabled = disabledButton;
}
</SCRIPT>
