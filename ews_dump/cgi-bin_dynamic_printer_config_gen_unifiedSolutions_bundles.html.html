
<html>

<head>
<meta http-equiv="content-type" content="text/html; charset=utf-8">
<title>Gerenc. de apps</title>
<link rel="stylesheet" href="/cgi-bin/dynamic/printer/solutions.css" type="text/css">
<link rel="stylesheet" href="/cgi-bin/dynamic/printer/breadcrumbs.css" type="text/css">
<script type="text/javascript">
function selected(selected, notSelected) {
    document.getElementById(selected).className="currentTool";
    document.getElementById(notSelected).className="tool";
}

function init() {
    var head_content = document.getElementById("head_content");
    var frame_content = document.getElementById("frame_content");
    var view_apps = document.getElementById("viewApps");

    var container_height = 0;
    var container = window.document.body;

    if(window.innerHeight) {
        container_height = window.innerHeight - head_content.offsetHeight;
    } else if(container.parentElement.clientHeight) {
        container_height = container.parentElement.clientHeight - head_content.offsetHeight;
    } else if(container && container.clientHeight) {
        container_height = view_apps.contentWindow.document.body.offsetHeight 
                - (head_content.offsetHeight - container.clientHeight);
    }

    if(container_height > 0) {
        frame_content.style.height = container_height + "px";
    }
}
</script>
</head>

<body onload="init()" style="overflow: hidden">
