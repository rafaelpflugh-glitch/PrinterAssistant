<script language="JavaScript">
function goToNewBookmark()
{
var text = document.getElementById("answer").value;

}
</script>

<script language="JavaScript">
function goToDelete()
{
var text = document.getElementById("answer").value;

}
</script>

<script language="JavaScript">
function goToModify()
{
var text = document.getElementById("answer").value;

window.location="./modifyFolder.html?action=modify&index="+text;
else
window.location="./createNewBookmark.html?action=modify&index="+text;
}
</script>

<script language="JavaScript">
function goToNewFolder()
{
var text = document.getElementById("answer").value;

}
</script>

<script language="JavaScript">
function checkClickedItem(click)
{
document.getElementById("answer").value=click;
        document.getElementById("modifyButton").disabled=false;
        document.getElementById("deleteButton").disabled=false;
}
</script>

<script language="JavaScript">
function disableModDelButtons(click)
{
        document.getElementById("answer").value=click;
        document.getElementById("modifyButton").disabled=true;
        document.getElementById("deleteButton").disabled=true;
}
</script>

<script language="JavaScript">
