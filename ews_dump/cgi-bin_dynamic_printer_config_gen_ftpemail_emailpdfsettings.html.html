<script type="text/javascript">

function modifyFields()
{
    var pdfVer = document.getElementById("system.16688");
    var pdfCompress = document.getElementById("system.17468");
    var securePdf = document.getElementById("system.17475");
    var searchablePdf = document.getElementById("system.17471");
    var resolution = document.getElementById("system.16531");
    var toSetResolution300 = false;

    // PDF Version ...
    if (securePdf.value == 1) {
        // Secure PDF on
        var selected = 0;
        for (var i = 0; i < pdfVer.length; i++) {
            var value = pdfVer.options[i].value;
            if (
                value == 0 || // 1.2
                value == 1 || // 1.3
                value == 5 || // A-1a
                value == 6    // A-1b
            ) {
                pdfVer.options[i].disabled = true;
            }
        }
    } else {
        // Secure PDF off. Reset
        for (var i = 0; i < pdfVer.length; i++) {
            pdfVer.options[i].disabled = false;
        }
    }

    // Secure Pdf ...
    if (pdfVer.value == 0 || // 1.2
        pdfVer.value == 1 || // 1.3
        pdfVer.value == 5 || // A-1a
        pdfVer.value == 6    // A-1b
    ) {
        // Disable secure pdf
        securePdf.disabled = true;
    } else {
        // Enable secure pdf
        securePdf.disabled = false;
    }

    // Resolution ...
    if (pdfCompress.value == 12 || searchablePdf.value == 1) { // High || On
        toSetResolution300 = true;
    } else {
        toSetResolution300 = false;
    }

    if(toSetResolution300) {
        // Set resolution to 300 dpi
        for (var i = 0; i < resolution.length; i++) {
            var value = resolution.options[i].value;
            if (value == 300) { // 300 dpi
                resolution.options[i].defaultSelected = true;
                resolution.selectedIndex = i;
                break;
            }
        }
    } else {
        // Set resolution to the default
        for (var i = 0; i < resolution.length; i++) {
            var value = resolution.options[i].value;
            if (value == window.default_resolution) {
                resolution.options[i].defaultSelected = true;
                resolution.selectedIndex = i;
                break;
            }
        }
    }
}

function onChangeAction()
{
    modifyFields();
}

function onLoadAction()
{
    window.default_resolution = document.getElementById("system.16531").value;
    modifyFields();
}

function onSubmitAction()
{
    var securePdf = document.getElementById("system.17475");
    securePdf.disabled = false;
    return true;
}
</script>
